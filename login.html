<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | MediSafe</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-frame">


    <main class="app-content no-nav">


        <div class="auth-header">


            <div class="logo-mark-sm">

                💊

            </div>



            <h2>

                Iniciar sesión

            </h2>



            <p>

                Ingresa para continuar gestionando tus medicamentos de forma segura.

            </p>


        </div>





        <div class="form-group">


            <label>

                Correo electrónico

            </label>



            <input

            type="email"

            id="correo"

            placeholder="ejemplo@correo.com">


        </div>







        <div class="form-group">


            <label>

                Contraseña

            </label>



            <input

            type="password"

            id="password"

            placeholder="Ingrese su contraseña">


        </div>







        <button

        class="btn btn-primary"

        onclick="iniciarSesion()">


            Ingresar


        </button>







        <button

        class="btn btn-outline mt-16"

        onclick="irA('registro.html')">


            Crear una cuenta


        </button>






        <button

        class="btn btn-outline mt-16"

        onclick="irA('index.html')">


            Volver al inicio


        </button>





    </main>


</div>




<script src="./script.js?v=10"></script>


</body>

</html>
