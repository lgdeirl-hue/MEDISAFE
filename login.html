<div class="app-frame">

    <main class="app-content no-nav">


        <div class="auth-header">

            <div class="logo-mark-sm">
                💊
            </div>

            <h2>
                Bienvenido
            </h2>

            <p>
                Inicia sesión para continuar.
            </p>

        </div>


        <div class="form-group">

            <label>
                Correo electrónico
            </label>

            <input 
            type="email"
            id="correo"
            placeholder="ejemplo@correo.com">

        </div>


        <div class="form-group">

            <label>
                Contraseña
            </label>

            <input 
            type="password"
            id="password"
            placeholder="Ingrese su contraseña">

        </div>


        <button 
        class="btn btn-primary"
        onclick="iniciarSesion()">

            Ingresar

        </button>


        <button 
        class="btn btn-outline mt-16"
        onclick="irA('registro.html')">

            Crear cuenta

        </button>


    </main>

</div>
