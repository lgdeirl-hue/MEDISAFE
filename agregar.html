<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Agregar Medicamento | MediSafe</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="app-frame">

<main class="app-content">

<div class="page-header">

<button class="btn-back" onclick="irA('medicamentos.html')">

←

</button>

<h2>
Agregar medicamento
</h2>

</div>

<div class="medicamento-container">

<input
type="text"
id="nombreMedicamento"
placeholder="Nombre del medicamento">

<input
type="text"
id="dosisMedicamento"
placeholder="Dosis (ej: 500 mg)">

<input
type="time"
id="horaMedicamento">

<button
class="btn btn-primary"
onclick="guardarMedicamento()">

Guardar medicamento

</button>

</div>

</main>

</div>

<script src="script.js"></script>

</body>

</html>
