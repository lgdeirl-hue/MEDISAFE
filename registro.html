<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | MediSafe</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app-frame">


    <main class="app-content no-nav">


        <div class="auth-header">

            <div class="logo-mark-sm">
                💊
            </div>


            <h2>
                Crear cuenta
            </h2>


            <p>
                Regístrate para comenzar a gestionar tus medicamentos de forma segura.
            </p>


        </div>




        <div class="form-group">

            <label>
                Nombre completo
            </label>

            <input 
            type="text" 
            id="nombre"
            placeholder="Ingrese su nombre completo">

        </div>





        <div class="form-group">

            <label>
                Correo electrónico
            </label>

            <input 
            type="email" 
            id="correo"
            placeholder="ejemplo@correo.com">

        </div>





        <div class="form-group">

            <label>
                Contraseña
            </label>

            <input 
            type="password" 
            id="password"
            placeholder="Ingrese una contraseña">

        </div>





        <div class="form-group">

            <label>
                Confirmar contraseña
            </label>

            <input 
            type="password" 
            id="confirmar"
            placeholder="Repita la contraseña">

        </div>





        <button 
        class="btn btn-primary"
        onclick="registrarUsuario()">

            Crear cuenta

        </button>





        <button 
        class="btn btn-outline mt-16"
        onclick="irA('login.html')">

            Ya tengo una cuenta

        </button>



    </main>


</div>



<script src="./script.js?v=10"></script>


</body>

</html>
